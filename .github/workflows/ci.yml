name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: ImageMagick 7 (macOS; on Linux the ImageMagick tests are skipped)
        if: runner.os == 'macOS'
        run: brew install imagemagick
      - run: npm ci
      - run: npm run check
